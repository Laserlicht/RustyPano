[package]
name = "rustypano"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff", "png"] }
log = "0.4.35"
qcms = "0.3.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tiff = "0.11.3"
toml = "1.2.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
